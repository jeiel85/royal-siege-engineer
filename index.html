function buildPanel() {
  const eb = $('engineBtns'); eb.innerHTML = '';
  for (const e of ENGINES) {
    const b = document.createElement('button'); b.className = 'eb'; b.dataset.id = e.id;
    const ok = engineUnlocked(e.id);
    b.textContent = (ok ? '' : '🔒') + e.name;
    b.title = e.desc + (ok ? '' : ` (연구 필요: ${TECH_BY[e.tech].name})`);
    b.onclick = () => selectEngine(e.id);
    eb.appendChild(b);
  }
  const ab = $('ammoBtns'); ab.innerHTML = '';
  for (const a of AMMO) {
    const b = document.createElement('button'); b.className = 'ab'; b.dataset.id = a.id;
    const ok = ammoUnlocked(a.id);
    b.innerHTML = `<i style="background:${a.color}"></i>${a.key}.${ok ? '' : '🔒'}${a.name.split(' ').pop()}`;
    b.title = a.name + ' — ' + a.desc + (ok ? '' : ` (연구 필요: ${TECH_BY[a.tech].name})`);
    b.onclick = () => selectAmmo(a.id);
    ab.appendChild(b);
  }
  const bs = $('bpSlots'); bs.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const d = document.createElement('div'); d.className = 'bp';
    const l = document.createElement('button'); l.id = 'bpL' + i; l.onclick = () => loadBp(i);
    const sv = document.createElement('button'); sv.className = 'bps'; sv.textContent = '💾'; sv.title = `현재 설정을 설계도 ${i + 1}번에 저장`; sv.onclick = () => saveBp(i);
    d.append(l, sv); bs.appendChild(d);
  }
}
function selectEngine(id) {
  if (!engineUnlocked(id)) { toast(`연구 필요: ${TECH_BY[ENGINE_BY[id].tech].name}`); return; }
  SAVE.eng.engine = id; SFX.click(); syncPanel(); dirty();
}
function selectAmmo(id) {
  if (!ammoUnlocked(id)) { toast(`연구 필요: ${TECH_BY[AMMO_BY[id].tech].name}`); return; }
  if (SAVE.eng.engine === 'ram') { toast('충차는 탄환을 쓰지 않습니다'); return; }
  SAVE.eng.ammo = id; SFX.click(); syncPanel(); dirty();
}
function bpDesc(bp) {
  const e = ENGINE_BY[bp.engine];
  return `${e.name} · ${bp.engine === 'ram' ? '지면' : bp.angle + '°'} · ${e.cwLabel} ${bp.cw}${e.cwUnit}` +
    (bp.engine === 'trebuchet' ? ` · 슬링 ${bp.sling}m` : '') + (bp.engine !== 'ram' ? ` · ${AMMO_BY[bp.ammo].name}` : '');
}
function saveBp(i) {
  SAVE.bp[i] = { ...SAVE.eng }; saveGame(); SFX.click();
  toast(`설계도 ${i + 1}번 저장: ${bpDesc(SAVE.bp[i])}`); syncPanel();
}
function loadBp(i) {
  const bp = SAVE.bp[i]; if (!bp) return;
  if (!engineUnlocked(bp.engine)) { toast('이 설계도의 병기는 아직 연구되지 않았습니다'); return; }
  Object.assign(SAVE.eng, bp);
  if (!ammoUnlocked(SAVE.eng.ammo)) SAVE.eng.ammo = 'boulder';
  saveGame(); SFX.click(); syncPanel();
  toast(`설계도 ${i + 1}번 불러옴: ${bpDesc(bp)}`);
}
function syncPanel() {
  if (!BT) return;
  const E = SAVE.eng;
  if (!engineUnlocked(E.engine)) E.engine = 'trebuchet';
  if (!ammoUnlocked(E.ammo)) E.ammo = 'boulder';
  const eng = ENGINE_BY[E.engine];
  for (const b of $('engineBtns').children) b.classList.toggle('sel', b.dataset.id === E.engine);
  for (const b of $('ammoBtns').children) { b.classList.toggle('sel', b.dataset.id === E.ammo && E.engine !== 'ram'); b.disabled = E.engine === 'ram'; }
  const sA = $('sAngle'), sC = $('sCw'), sS = $('sSling'), step = has('m_pin') ? 0.5 : 1;
  if (eng.angle) {
    sA.min = eng.angle[0]; sA.max = eng.angle[1]; sA.step = step;
    E.angle = clamp(Math.round(E.angle / step) * step, eng.angle[0], eng.angle[1]);
    sA.value = E.angle; sA.disabled = false;
    $('vAngle').textContent = (step < 1 ? E.angle.toFixed(1) : E.angle) + '°';
  } else { sA.disabled = true; $('vAngle').textContent = '지면'; }
  sA.closest('.sl').classList.toggle('dis', !eng.angle);
  const cmax = cwMax(E.engine);
  sC.min = eng.cw[0]; sC.max = cmax; sC.step = 1; E.cw = clamp(Math.round(E.cw), eng.cw[0], cmax); sC.value = E.cw;
  $('lCw').textContent = eng.cwLabel + ' (←→)';
  $('vCw').textContent = `${E.cw} ${eng.cwUnit}`;
  const [s0, s1] = slingRange();
  sS.min = s0; sS.max = s1; sS.step = 0.5; E.sling = clamp(E.sling, s0, s1); sS.value = E.sling;
  const isT = E.engine === 'trebuchet';
  sS.disabled = !isT; $('rowSling').classList.toggle('dis', !isT);
  $('vSling').textContent = isT ? `${E.sling.toFixed(1)} m` : '-';
  const ammo = E.engine === 'ram' ? 'boulder' : E.ammo;
  const v = launchSpeed(E.engine, E.cw, E.sling, ammo), ang = (eng.angle ? E.angle : 0) * DEG;
  $('vInfo').textContent = `초속 ${(v / PPM).toFixed(1)} m/s` +
    (E.engine === 'ram' ? ' · 지면 돌격' : ` · 무풍·무저항 이론 사거리 ≈ ${Math.round(v * v * Math.sin(2 * ang) / G / PPM)} m`);
  $('vInfo').title = eng.desc;
  for (let i = 0; i < 5; i++) {
    const bp = SAVE.bp[i], l = $('bpL' + i);
    if (!l) continue;
    l.textContent = bp ? `${i + 1}: ${ENGINE_BY[bp.engine].name.slice(0, 3)} ${bp.engine === 'ram' ? '' : bp.angle + '°'} ${bp.cw}${ENGINE_BY[bp.engine].cwUnit}` : `${i + 1}: 비어 있음`;
    l.title = bp ? bpDesc(bp) : '저장된 설계도 없음';
    l.disabled = !bp;
  }
  updateFireBtn();
}
let fireLabel = '';
function updateFireBtn() {
  if (!BT) return;
  const burst = BT.state === 'flight' && BT.burstReady;
  const can = BT.state === 'aim' && BT.reload <= 0 && BT.shotsUsed < BT.shotsMax && !BT.result;
  $('btnFire').disabled = !(can || burst);
  const lbl = burst ? '공중 폭발!<br><small>SPACE</small>' : BT.shotsUsed >= BT.shotsMax ? '탄환 소진<br><small>결과 대기</small>' : '발사 레버 당기기<br><small>SPACE</small>';
  if (lbl !== fireLabel) { fireLabel = lbl; $('btnFire').innerHTML = lbl; }
  const f = BT.state === 'reload' ? 1 - BT.reload / BT.reloadMax : BT.state === 'aim' ? 1 : 0;
  $('reload').firstElementChild.style.width = Math.round(f * 100) + '%';
}
function updateHUD() {
  if (!BT) return;
  $('hStage').textContent = `제${BT.idx + 1}성채 · ${BT.S.fortName}`;
  const w = BT.wind;
  $('windTxt').textContent = `${w >= 0 ? '→ 순풍' : '← 역풍'} ${Math.abs(w).toFixed(1)} m/s`;
  const left = BT.shotsMax - BT.shotsUsed;
  $('hShots').textContent = `${left}/${BT.shotsMax}`;
  $('hShots').parentElement.classList.toggle('warn', left <= 1);
  $('hDestr').textContent = Math.round(BT.destr * 100) + '%';
  $('hDestr').parentElement.classList.toggle('good', BT.destr >= STAR_DESTR);
  const alive = BT.units.filter(u => u.alive).length;
  $('hDef').textContent = alive === 0 ? '전멸!' : `${alive}/${BT.units.length}명${BT.lordDead ? ' (영주 X)' : ''}`;
  $('hDefBox').classList.toggle('good', alive === 0);
  $('hGold').textContent = SAVE.gold;
  updateFireBtn();
}
function toggleStress() {
  if (!BT) return;
  BT.stressOn = !BT.stressOn;
  if (BT.stressOn) computeLoads(false);
  $('btnStress').classList.toggle('sel', BT.stressOn);
}

// ---------------------------------------------------------------- 결과 화면
// 받침 유무에 따라 조사 선택 (예: 장원은 / 요새는)
function josa(word, withBatchim, without) {
  const c = word.charCodeAt(word.length - 1) - 0xAC00;
  return c >= 0 && c <= 11171 && c % 28 !== 0 ? withBatchim : without;
}
const TIPS = [
  '⚖ 하중 분석으로 하중이 몰린 주춧돌을 찾아 노려 보세요.',
  '역풍(←)이면 균형추를 늘리거나 슬링을 길게 하세요.',
  '흰 점선은 직전 궤적입니다. 착탄 지점과 비교해 보정하세요.',
  '목조 요새에는 유황 화염탄이, 성벽 안 영주에게는 관통 철갑탄이 효과적입니다.',
  '산탄 자탄은 수비병 머리 위에서 SPACE로 터뜨리세요.',
  '공학 연구소의 탄약고 확장은 모든 공성전의 탄환을 늘려 줍니다.',
  '부식 가스는 철창살 성문을 녹이고 수비병을 항복시킵니다.',
];
function showResult() {
  const r = BT && BT.result; if (!r) return;
  const S = BT.S;
  if (r.win) {
    const stars = [0, 1, 2].map(i => i < r.stars ? '★' : '<span class="off">★</span>').join('');
    const ending = BT.idx === 29 ? `<div class="q">검은 공작의 흑철 대성채가 무너졌다. 서른 영주의 반란은 끝났고, 왕국에 평화가 돌아왔다.<br>왕립 수석 공성 공학자 로버트 드 발루아 — 그대의 이름은 연대기에 길이 남으리라.</div>` : '';
    openModal(`<h2 class="serif">${S.fortName} 함락!</h2>
      <div class="stars">${stars}</div>${ending}
      <div class="mrow"><span>★ 수비대 전멸</span><b>달성</b></div>
      <div class="mrow"><span>★ 파괴율 50% 이상</span><b>${Math.round(BT.destr * 100)}% · ${BT.destr >= STAR_DESTR ? '달성' : '미달'}</b></div>
      <div class="mrow"><span>★ ${S.par}발 이하 사용</span><b>${BT.shotsUsed}발 · ${BT.shotsUsed <= S.par ? '달성' : '미달'}</b></div>
      <div class="mrow"><span>파괴한 블록 / 쓰러뜨린 수비병</span><b>${BT.blocksBroken} / ${BT.kills}</b></div>
      <div class="mrow"><span>획득 골드${r.replay ? ' (재정복 35%)' : ''}${has('t_royal') ? ' · 하사금 +30%' : ''}</span><b>+${r.gold} (보유 ${SAVE.gold})</b></div>
      <div class="row">${BT.idx < 29 ? '<button class="big" id="mNext">다음 성채 ▶</button>' : ''}<button id="mRetry">다시 도전</button><button id="mTech">공학 연구소</button><button id="mMap">정복도</button></div>`);
    if ($('mNext')) $('mNext').onclick = () => { closeModal(); enterBattle(BT.idx + 1); };
  } else {
    const alive = BT.units.filter(u => u.alive).length;
    openModal(`<h2 class="serif">공성 실패</h2>
      <div class="q">“하하하! ${S.fortName}${josa(S.fortName, '은', '는')} 아직 건재하다!” — ${S.lordName}</div>
      <div class="mrow"><span>파괴율</span><b>${Math.round(BT.destr * 100)}%</b></div>
      <div class="mrow"><span>남은 수비대</span><b>${alive}명${BT.lordDead ? '' : ' (영주 생존)'}</b></div>
      <div class="q" style="font-style:normal">💡 ${TIPS[Math.floor(Math.random() * TIPS.length)]}</div>
      <div class="row"><button class="big" id="mRetry">다시 도전</button><button id="mTech">공학 연구소</button><button id="mMap">정복도</button></div>`);
  }
  $('mRetry').onclick = () => { closeModal(); enterBattle(BT.idx); };
  $('mTech').onclick = () => { closeModal(); BT = null; showScreen('tech'); };
  $('mMap').onclick = () => { closeModal(); BT = null; showScreen('map'); };
}
function leaveBattle() {
  if (BT && !BT.result && BT.shotsUsed > 0) {
    openModal(`<h2 class="serif">공성 중단</h2><div class="q">진행 중인 공성전을 포기하고 정복도로 돌아갈까요?</div>
      <div class="row"><button class="big" id="mYes">정복도로</button><button id="mNo">계속 공성</button></div>`);
    $('mYes').onclick = () => { closeModal(); BT = null; showScreen('map'); };
    $('mNo').onclick = closeModal;
    return;
  }
  BT = null; showScreen('map');
}

// ---------------------------------------------------------------- 버튼 · 입력
$('btnContinue').onclick = () => { SFX.init(); SFX.click(); showScreen('map'); };
$('btnNew').onclick = () => {
  SFX.init(); SFX.click();
  const begin = () => {
    SAVE = defaultSave(); SAVE.started = true; saveGame();
    showScreen('map');
    openModal(`<h2 class="serif">왕명</h2><div class="q">“로버트 드 발루아, 반역 영주들의 성채를 하나씩 무너뜨려 왕국의 평화를 되찾으라.”</div>
      <p style="font-size:14px;line-height:1.7">첫 목표는 샹파뉴 평원의 <b>라쿠르 목책 요새</b>입니다. 승리할 때마다 받는 골드로 <b>공학 연구소</b>에서 새 병기와 탄환을 연구하세요.</p>
      <div class="row"><button class="big" id="mClose">출정</button></div>`);
    $('mClose').onclick = closeModal;
  };
  if (!SAVE.started) { begin(); return; }
  openModal(`<h2 class="serif">새 원정</h2><div class="q">기존 저장(별·골드·연구·설계도)을 모두 지우고 처음부터 시작할까요?</div>
    <div class="row"><button class="big" id="mYes">새로 시작</button><button id="mNo">취소</button></div>`);
  $('mYes').onclick = () => { closeModal(); begin(); };
  $('mNo').onclick = closeModal;
};
$('btnHow').onclick = () => { SFX.init(); showHelp(); };
$('btnTech').onclick = () => { SFX.click(); showScreen('tech'); };
$('btnTechBack').onclick = () => { SFX.click(); showScreen('map'); };
$('btnToTitle').onclick = () => { SFX.click(); showScreen('title'); };
$('btnMapSound').onclick = toggleMusic;
$('btnSound').onclick = toggleMusic;
$('btnHelp').onclick = showHelp;
$('btnStress').onclick = toggleStress;
$('btnRetry').onclick = () => { if (BT) enterBattle(BT.idx); };
$('btnMap').onclick = leaveBattle;
$('btnFire').onclick = () => fire();
$('sAngle').oninput = e => { SAVE.eng.angle = +e.target.value; syncPanel(); dirty(); };
$('sCw').oninput = e => { SAVE.eng.cw = +e.target.value; syncPanel(); dirty(); };
$('sSling').oninput = e => { SAVE.eng.sling = +e.target.value; syncPanel(); dirty(); };
// 슬라이더가 키보드 포커스를 잡아 SPACE/방향키를 가로채지 않도록
for (const id of ['sAngle', 'sCw', 'sSling']) $(id).addEventListener('keydown', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (SCREEN !== 'battle' || !BT) return;
  if (isModalOpen()) { if (e.code === 'Escape' && !BT.result) closeModal(); return; }
  if (e.target && e.target.tagName === 'BUTTON' && e.code === 'Space') e.preventDefault();
  const E = SAVE.eng, eng = ENGINE_BY[E.engine], st = has('m_pin') ? 0.5 : 1;
  let changed = true;
  switch (e.code) {
    case 'Space': e.preventDefault(); if (!e.repeat) fire(); changed = false; break;
    case 'ArrowUp': e.preventDefault(); if (eng.angle) E.angle = clamp(E.angle + st, eng.angle[0], eng.angle[1]); break;
    case 'ArrowDown': e.preventDefault(); if (eng.angle) E.angle = clamp(E.angle - st, eng.angle[0], eng.angle[1]); break;
    case 'ArrowRight': e.preventDefault(); E.cw = clamp(E.cw + 1, eng.cw[0], cwMax(E.engine)); break;
    case 'ArrowLeft': e.preventDefault(); E.cw = clamp(E.cw - 1, eng.cw[0], cwMax(E.engine)); break;
    case 'KeyE': if (E.engine === 'trebuchet') E.sling = clamp(E.sling + 0.5, ...slingRange()); break;
    case 'KeyQ': if (E.engine === 'trebuchet') E.sling = clamp(E.sling - 0.5, ...slingRange()); break;
    case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4': case 'Digit5':
      selectAmmo(AMMO[+e.code.slice(5) - 1].id); changed = false; break;
    case 'KeyZ': case 'KeyX': {
      const list = ENGINES.filter(x => engineUnlocked(x.id)).map(x => x.id);
      const k = list.indexOf(E.engine), d = e.code === 'KeyX' ? 1 : -1;
      selectEngine(list[(k + d + list.length) % list.length]); changed = false; break;
    }
    case 'KeyS': toggleStress(); changed = false; break;
    case 'KeyR': enterBattle(BT.idx); changed = false; break;
    case 'KeyM': leaveBattle(); changed = false; break;
    case 'Escape': showHelp(); changed = false; break;
    default: changed = false;
  }
  if (changed) { syncPanel(); dirty(); }
});
cv.addEventListener('pointerdown', e => {
  if (SCREEN !== 'battle' || !BT || !VIEW.pan) return;
  BT.cam.drag = { x: e.clientX, cx: BT.cam.x };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  const d = BT && BT.cam.drag; if (!d) return;
  BT.cam.x = d.cx - (e.clientX - d.x) / VIEW.s; BT.cam.home = BT.cam.x;
});
const endDrag = () => { if (BT) BT.cam.drag = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('wheel', e => {
  if (SCREEN !== 'battle' || !BT || !VIEW.pan) return;
  BT.cam.home = clamp(BT.cam.x + (e.deltaY + e.deltaX) / VIEW.s * 0.5, 0, BT.W - VIEW.viewW);
  BT.cam.x = BT.cam.home;
}, { passive: true });
document.addEventListener('visibilitychange', () => SFX.pause(document.hidden));
window.addEventListener('beforeunload', () => saveGame());

// ---------------------------------------------------------------- 메인 루프
let lastT = performance.now(), autoSaveT = 0, crashed = false;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  try {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (SCREEN === 'battle' && BT) {
      if (!isModalOpen() || BT.result) updateBattle(dt);
      renderBattle(dt);
    } else renderMenuBackdrop(dt);
    if (SAVE.started) {
      SAVE.stats.time += dt;
      autoSaveT += dt;
      if (autoSaveT > 20) { autoSaveT = 0; saveGame(); }
    }
  } catch (err) {
    if (!crashed) {
      crashed = true;
      console.error('게임 루프 오류', err);
      saveGame();
      openModal(`<h2 class="serif">오류 발생</h2><div class="q">예기치 못한 오류로 공성전이 중단되었습니다. 진행 상황은 저장되었습니다.</div>
        <pre style="font-size:11px;white-space:pre-wrap;max-height:160px;overflow:auto">${String(err && err.stack || err).replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;')}</pre>
        <div class="row"><button class="big" onclick="location.reload()">새로고침</button></div>`);
    }
    return;
  }
  requestAnimationFrame(frame);
}
showScreen('title');
requestAnimationFrame(frame);
</script>
