<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>왕립 공성 공학자 — 30 성채의 반란</title>
<style>
:root{
  --ink:#2b1d10; --parch:#f1e2bf; --gold:#e8b84a; --red:#a3312a; --ok:#79b85a;
  --panel:rgba(26,17,10,.93); --line:#6b4a26;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1a120b;color:var(--parch);
  font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:1px solid #8a6a3a;background:linear-gradient(#6b4a26,#4a3018);
  color:var(--parch);border-radius:6px;padding:6px 10px;font-size:13px;line-height:1.2;
  box-shadow:inset 0 1px 0 rgba(255,230,180,.25),0 2px 0 #1d1209}
button:hover:not(:disabled){filter:brightness(1.18)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.42;cursor:not-allowed}
button.sel{background:linear-gradient(#c8902f,#8a5a17);color:#fff8e6;border-color:#f3c76a}
button.big{font-size:17px;padding:11px 22px;font-weight:bold}
.serif{font-family:"Batang","Nanum Myeongjo","AppleMyungjo",Georgia,serif}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;
  background:linear-gradient(rgba(20,13,7,.9),rgba(20,13,7,.7));border-bottom:1px solid var(--line);z-index:5;font-size:13px}
.hi{background:rgba(0,0,0,.32);border:1px solid rgba(232,184,74,.25);border-radius:6px;padding:4px 8px;white-space:nowrap}
.hi b{color:var(--gold);font-variant-numeric:tabular-nums}
.hi.warn b{color:#ff8a6a}
.hi.good b{color:#9be37a}
#hStage{font-weight:bold;max-width:300px;overflow:hidden;text-overflow:ellipsis}
#windTxt{display:inline-block;min-width:96px}
.sp{flex:1}

/* control panel */
#panel{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;padding:8px 10px;
  background:var(--panel);border-top:2px solid var(--line);z-index:5}
.pg{background:rgba(255,240,200,.05);border:1px solid rgba(232,184,74,.2);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
.pl{font-size:11px;color:#c9b07a;letter-spacing:.04em}
.row{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}
.sl{display:grid;grid-template-columns:96px 1fr 62px;align-items:center;gap:6px;font-size:12px;min-width:280px}
.sl b{color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
.sl.dis{opacity:.35}
input[type=range]{accent-color:#e8b84a;width:100%;cursor:pointer}
#vInfo{font-size:11px;color:#d8c28e}
.eb,.ab{font-size:12px;padding:5px 7px}
.ab i{font-style:normal;display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#fireWrap{justify-content:center;min-width:132px}
#btnFire{font-size:16px;font-weight:bold;padding:10px 14px;background:linear-gradient(#b8432f,#7a1f14);border-color:#f08a6a;flex:1}
#btnFire small{font-size:10px;font-weight:normal;opacity:.8}
#reload{height:6px;background:#000;border-radius:3px;overflow:hidden;border:1px solid #4a3018}
#reload i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c8902f,#f3d27a)}
#bpSlots{display:grid;grid-template-columns:1fr;gap:2px}
.bp{display:flex;gap:2px}
.bp button{font-size:10.5px;padding:2px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp button:first-child{flex:1;min-width:116px;max-width:160px;text-align:left}
.bp .bps{font-size:10px;padding:2px 4px;background:linear-gradient(#3e5a2a,#2a3e1b);border-color:#6a8a4a}

/* screens */
.screen{position:absolute;inset:0;z-index:10;overflow:auto;background:radial-gradient(ellipse at 50% 40%,rgba(40,26,14,.55),rgba(10,6,3,.92))}
.parch{background:linear-gradient(#f3e5c4,#e0c896);color:var(--ink);border:3px solid #6b4a26;border-radius:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(120,80,30,.32)}
.titleWrap{max-width:760px;margin:6vh auto 40px;padding:26px 30px;text-align:center}
.crest{font-size:54px;color:#8a1f18;text-shadow:0 2px 0 #e8b84a}
.titleWrap h1{font-size:42px;letter-spacing:.06em;color:#5a1610;text-shadow:0 2px 0 rgba(255,240,200,.8)}
.titleWrap h2{font-size:18px;margin:6px 0 16px;color:#5a3b20}
.story{font-size:14.5px;line-height:1.75;text-align:left;margin:0 auto 18px;white-space:pre-line}
.titleWrap .row{gap:10px;margin:8px 0}
#saveInfo{font-size:13px;margin-top:10px;color:#5a3b20}
.topbar{position:sticky;top:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:rgba(20,13,7,.95);border-bottom:2px solid var(--line);z-index:2}
.topbar h2{font-size:20px;color:var(--gold)}
.chip{background:rgba(0,0,0,.35);border:1px solid rgba(232,184,74,.3);border-radius:14px;padding:4px 12px;font-size:13px}
.chip b{color:var(--gold)}
#regions{padding:14px;display:flex;flex-direction:column;gap:14px;max-width:1180px;margin:0 auto}
.region{padding:12px 14px}
.region h3{font-size:18px;color:#5a1610}
.region p{font-size:13px;margin:2px 0 10px;color:#5a3b20}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stg{position:relative;text-align:left;padding:8px 10px;background:linear-gradient(#fff5dc,#ead6a6);color:var(--ink);border:2px solid #8a6a3a;border-radius:8px;min-height:74px}
.stg .n{font-size:11px;color:#7a5a30}
.stg .nm{font-size:13px;font-weight:bold;margin:2px 0}
.stg .st{color:#c8902f;font-size:15px;letter-spacing:1px}
.stg.lock{background:linear-gradient(#bfb39a,#a69878);color:#5d5444}
.stg.boss{border-color:#a3312a;box-shadow:inset 0 0 0 1px #a3312a}
.stg.cur{outline:3px solid #e8b84a}
#techGrid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;padding:14px;max-width:1240px;margin:0 auto}
.branch{padding:10px}
.branch h3{font-size:16px;color:#5a1610;margin-bottom:8px;text-align:center}
.tn{display:block;width:100%;text-align:left;margin-bottom:8px;padding:8px 10px;background:linear-gradient(#fff5dc,#ead6a6);color:var(--ink);border:2px solid #8a6a3a;border-radius:8px;position:relative}
.tn .tt{font-weight:bold;font-size:13.5px}
.tn .td{font-size:12px;margin:3px 0;color:#4a3420}
.tn .tc{font-size:12px;font-weight:bold;color:#8a5a17}
.tn.own{background:linear-gradient(#d9efc4,#b5d896);border-color:#4f7a33}
.tn.own .tc{color:#3c6a22}
.tn.lock{background:linear-gradient(#c9bea6,#b1a486);color:#625844}
.tn.own:disabled{opacity:1;cursor:default}
.tn::after{content:"";position:absolute;left:50%;bottom:-10px;width:2px;height:8px;background:#8a6a3a}
.tn:last-child::after{display:none}

/* modal & banner */
#modal{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#modalBox{max-width:560px;width:100%;padding:22px 24px;max-height:92vh;overflow:auto}
#modalBox h2{font-size:24px;color:#5a1610;margin-bottom:6px;text-align:center}
#modalBox .mrow{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(90,59,32,.35);padding:5px 0;font-size:14px}
#modalBox .mrow b{color:#7a1f14}
#modalBox .q{font-style:italic;margin:8px 0 12px;color:#5a3b20;text-align:center}
#modalBox .stars{font-size:44px;text-align:center;color:#c8902f;letter-spacing:6px;margin:6px 0}
#modalBox .stars .off{color:rgba(90,59,32,.25)}
#modalBox .row{justify-content:center;gap:10px;margin-top:16px}
#modalBox ul{margin:6px 0 0 20px;font-size:14px;line-height:1.7}
#modalBox kbd{background:#3b2716;color:#f1e2bf;border-radius:4px;padding:1px 6px;font-size:12px}
#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:8;pointer-events:none;text-align:center;
  font-size:26px;font-weight:bold;color:#fff3d0;text-shadow:0 3px 0 #000,0 0 24px rgba(0,0,0,.8);opacity:0;transition:opacity .4s;white-space:nowrap}
#banner small{display:block;font-size:15px;font-weight:normal;color:#e8d7a8;margin-top:6px}
#banner.show{opacity:1}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:30;background:rgba(20,13,7,.95);border:1px solid var(--gold);
  border-radius:8px;padding:8px 14px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#saveFlash{position:absolute;right:10px;bottom:8px;z-index:40;font-size:11px;color:#9be37a;opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 1px 0 #000}
#saveFlash.show{opacity:.9}
@media (max-width:1100px),(max-height:700px){
  #hud{font-size:11.5px;gap:4px;padding:4px 6px}
  .hi{padding:2px 6px}
  #hud button{padding:3px 7px;font-size:12px}
  #panel{gap:5px;padding:5px 6px}
  .pg{padding:4px 6px;gap:2px}
  .pl,#vInfo{display:none}
  .sl{min-width:200px;grid-template-columns:76px 1fr 48px;font-size:11px;gap:4px}
  .eb,.ab{font-size:11px;padding:3px 5px}
  #fireWrap{min-width:110px}
  #btnFire{padding:6px 10px;font-size:14px}
  #bpSlots{grid-template-columns:repeat(5,auto)}
  .bp{flex-direction:column}
  .bp button:first-child{min-width:0;max-width:70px}
}
@media (max-width:900px){
  .sl{min-width:200px;grid-template-columns:76px 1fr 48px}
  #techGrid{grid-template-columns:repeat(2,minmax(160px,1fr))}
  .titleWrap h1{font-size:30px}
  #banner{font-size:19px;white-space:normal;width:90%}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="hi" id="hStage">제1성채</div>
  <div class="hi">풍향 <b id="windTxt">→ 0.0 m/s</b></div>
  <div class="hi">탄환 <b id="hShots">0/0</b></div>
  <div class="hi">파괴율 <b id="hDestr">0%</b></div>
  <div class="hi" id="hDefBox">수비대 <b id="hDef">0/0</b></div>
  <div class="hi">골드 <b id="hGold">0</b></div>
  <div class="sp"></div>
  <button id="btnStress" title="하중 분석 보기 (S)">⚖ 하중</button>
  <button id="btnHelp" title="조작법">?</button>
  <button id="btnSound" title="음악 켜기/끄기">♪</button>
  <button id="btnRetry" title="다시 도전 (R)">↻</button>
  <button id="btnMap" title="정복도로 (M)">⚑ 정복도</button>
</div>

<div id="panel" class="hidden">
  <div class="pg">
    <div class="pl">공성 병기 (Z/X)</div>
    <div class="row" id="engineBtns"></div>
    <div class="pl" style="margin-top:2px">투사 탄환 (1~5)</div>
    <div class="row" id="ammoBtns"></div>
  </div>
  <div class="pg">
    <label class="sl"><span>발사각 (↑↓)</span><input type="range" id="sAngle"><b id="vAngle"></b></label>
    <label class="sl"><span id="lCw">균형추 중량 (←→)</span><input type="range" id="sCw"><b id="vCw"></b></label>
    <label class="sl" id="rowSling"><span>슬링 끈 길이 (Q/E)</span><input type="range" id="sSling"><b id="vSling"></b></label>
    <div id="vInfo"></div>
  </div>
  <div class="pg" id="fireWrap">
    <button id="btnFire">발사 레버 당기기<br><small>SPACE</small></button>
    <div id="reload"><i></i></div>
  </div>
  <div class="pg">
    <div class="pl">커스텀 설계도 (클릭: 불러오기)</div>
    <div id="bpSlots"></div>
  </div>
</div>

<div id="banner"></div>

<div id="scrTitle" class="screen">
  <div class="titleWrap parch">
    <div class="crest">⚜</div>
    <h1 class="serif">왕립 공성 공학자</h1>
    <h2 class="serif">로버트 드 발루아와 서른 성채의 반란</h2>
    <p class="story serif" id="storyTxt"></p>
    <div class="row center">
      <button id="btnContinue" class="big">이어하기</button>
      <button id="btnNew" class="big">새 원정</button>
      <button id="btnHow" class="big">조작법</button>
    </div>
    <div id="saveInfo"></div>
  </div>
</div>

<div id="scrMap" class="screen hidden">
  <div class="topbar">
    <h2 class="serif">왕국 정복도</h2>
    <span class="chip">골드 <b id="mapGold">0</b></span>
    <span class="chip">별 <b id="mapStars">0/90</b></span>
    <span class="chip">정복 <b id="mapConq">0%</b></span>
    <span class="sp"></span>
    <button id="btnTech">⚙ 공학 연구소</button>
    <button id="btnMapSound">♪ 음악</button>
    <button id="btnToTitle">타이틀</button>
  </div>
  <div id="regions"></div>
</div>

<div id="scrTech" class="screen hidden">
  <div class="topbar">
    <h2 class="serif">왕립 군사공학 연구소</h2>
    <span class="chip">골드 <b id="techGold">0</b></span>
    <span class="chip">연구 <b id="techCount">0/24</b></span>
    <span class="sp"></span>
    <button id="btnTechBack">← 정복도</button>
  </div>
  <div id="techGrid"></div>
</div>

<div id="modal" class="hidden"><div id="modalBox" class="parch"></div></div>
<div id="toast"></div>
<div id="saveFlash">💾 자동 저장됨</div>

<script>
'use strict';
// ======================================================================
//  핵심 상수 · 유틸
// ======================================================================
const GY = 900;            // 지면 높이 (월드 좌표, y는 아래로 증가)
const G = 294;             // 중력 가속도 (u/s²)
const PPM = 10;            // 표시용: 10u = 1m
const DT = 1 / 120;        // 물리 고정 스텝
const ITER = 10;           // 충돌 해석 반복 횟수
const MAX_BODIES = 340;
const ENGINE_X = 120;
const V_DMG = 80;          // 이 속도 이상 충돌부터 파손 발생
const DMG_K = 1.2e-3;      // 충돌 에너지 → 내구도 피해 환산 계수
const STAR_DESTR = 0.5;    // 별 조건: 파괴율 50% 이상

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const DEG = Math.PI / 180;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ======================================================================
//  재질 · 탄환 · 병기 · 연구 데이터
// ======================================================================
const MATS = {
  wood:    { name: '목재',   dens: 0.7,  hp: 70,  str: 3,   flam: 1.0, burnRate: 7,  burnTime: 9, color: '#8b5a2b', dark: '#4a2e14', chip: '#b07a40', value: 1.0 },
  thatch:  { name: '짚 차양', dens: 0.35, hp: 30,  str: 1.2, flam: 1.6, burnRate: 14, burnTime: 6, color: '#c9a24a', dark: '#7a5f22', chip: '#e0c070', value: 0.6 },
  stone:   { name: '석재',   dens: 1.6,  hp: 170, str: 6,   flam: 0,   color: '#8d9198', dark: '#4c5056', chip: '#b0b4ba', value: 1.6 },
  granite: { name: '화강암', dens: 1.9,  hp: 270, str: 9,   flam: 0,   color: '#62666e', dark: '#30333a', chip: '#878c94', value: 2.0 },
  iron:    { name: '철제',   dens: 2.4,  hp: 420, str: 12,  flam: 0,   color: '#4b5058', dark: '#202328', chip: '#9aa0a8', value: 2.4 },
};

const AMMO = [
  { id: 'boulder',  key: '1', name: '화강암 바위탄', mass: 10, r: 14, drag: 1.1e-4, dmg: 1.0, unit: 1.0, color: '#8d8f93', tech: null,
    desc: '묵직한 기본 탄. 착탄 시 충격파로 주변 보병을 넉백.' },
  { id: 'fire',     key: '2', name: '유황 화염탄',   mass: 6,  r: 12, drag: 1.5e-4, dmg: 0.6, unit: 1.0, color: '#ff7a1a', tech: 'a_fire',
    desc: '목재·짚에 불을 붙여 연쇄 전소시킨다. 석재·철에는 무력.' },
  { id: 'ap',       key: '3', name: '관통 철갑탄',   mass: 9,  r: 9,  drag: 0.7e-4, dmg: 1.5, unit: 1.3, color: '#3a3f47', tech: 'a_ap', pierce: 2,
    desc: '부술 수 있는 블록은 꿰뚫고 계속 날아가 내부 지휘관을 노린다.' },
  { id: 'shrapnel', key: '4', name: '산탄 자탄',     mass: 7,  r: 12, drag: 1.3e-4, dmg: 0.5, unit: 1.0, color: '#6d5a3a', tech: 'a_shrap',
    desc: '비행 중 SPACE로 공중 폭발, 쇳조각을 흩뿌린다. 보병에 치명적.' },
  { id: 'gas',      key: '5', name: '부식 가스탄',   mass: 5,  r: 11, drag: 1.7e-4, dmg: 0.3, unit: 0.5, color: '#7fbf3a', tech: 'a_gas',
    desc: '가스 구름이 수비병의 사기를 꺾어 항복시키고 철제를 부식시킨다.' },
];
const AMMO_BY = Object.fromEntries(AMMO.map(a => [a.id, a]));

const ENGINES = [
  { id: 'trebuchet', name: '트레뷰셋', angle: [0, 90],  cw: [1, 50], cwLabel: '균형추 중량', cwUnit: '톤', reload: 2.2, tech: null,
    desc: '곡사 장거리 거대 파괴. 균형추·슬링 길이로 사거리 조절.' },
  { id: 'mangonel',  name: '망고넬',   angle: [10, 75], cw: [1, 30], cwLabel: '비틀림 장력', cwUnit: '톤', reload: 1.1, tech: 'e_mangonel',
    desc: '직사 중거리 고속 연사. 작은 돌 3발을 산개 사격.' },
  { id: 'ballista',  name: '발리스타', angle: [0, 45],  cw: [1, 40], cwLabel: '활시위 장력', cwUnit: '톤', reload: 1.4, tech: 'e_ballista',
    desc: '정밀 직사 관통 볼트. 바람 영향이 매우 적다.' },
  { id: 'ram',       name: '장갑 충차', angle: null,    cw: [5, 50], cwLabel: '돌격 추진력', cwUnit: '명', reload: 2.6, tech: 'e_ram',
    desc: '지면을 돌진해 성문·목책을 분쇄. 해자와 절벽은 넘지 못한다.' },
];
const ENGINE_BY = Object.fromEntries(ENGINES.map(e => [e.id, e]));

const SAVE_KEY = 'royalSiegeEngineer_v1';
function defaultSave() {
  return {
    v: 1, gold: 0, stars: Array(30).fill(0), best: Array(30).fill(0), cleared: Array(30).fill(false),
    techs: {}, bp: [null, null, null, null, null],
    set: { music: true, sfx: true },
    eng: { engine: 'trebuchet', angle: 45, cw: 15, sling: 5, ammo: 'boulder' },
    stats: { shots: 0, blocks: 0, kills: 0, time: 0 }, started: false, lastStage: 0,
  };
}
function loadSave() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { console.warn('저장소 접근 불가', e); return defaultSave(); }
  if (!raw) return defaultSave();
  try {
    const s = JSON.parse(raw), d = defaultSave();
    if (!s || s.v !== 1) return d;
    const fixArr = (a, fill) => Array.from({ length: 30 }, (_, i) => (Array.isArray(a) && a[i] != null) ? a[i] : fill);
    return {
      ...d, ...s,
      stars: fixArr(s.stars, 0), best: fixArr(s.best, 0), cleared: fixArr(s.cleared, false),
      techs: s.techs || {}, bp: Array.from({ length: 5 }, (_, i) => (s.bp && s.bp[i]) || null),
      set: { ...d.set, ...(s.set || {}) }, eng: { ...d.eng, ...(s.eng || {}) }, stats: { ...d.stats, ...(s.stats || {}) },
    };
  } catch (e) {
    console.warn('세이브 데이터 손상, 백업 후 초기화', e);
    try { localStorage.setItem(SAVE_KEY + '_corrupt_' + Date.now(), raw); } catch (e2) { console.warn(e2); }
    return defaultSave();
  }
}
let SAVE = loadSave();
let saveFailWarned = false;
function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE));
    const f = $('saveFlash'); f.classList.add('show');
    clearTimeout(saveGame._t); saveGame._t = setTimeout(() => f.classList.remove('show'), 900);
  } catch (e) {
    console.warn('저장 실패', e);
    if (!saveFailWarned) { saveFailWarned = true; toast('⚠ 저장 실패: 브라우저 저장소를 사용할 수 없습니다'); }
  }
}

// ======================================================================
//  Web Audio 효과음 · 중세 BGM (외부 에셋 없이 합성)
// ======================================================================
const SFX = (() => {
  let ac = null, master, sfxG, musG, noiseBuf;
  let wh = null, drone = null, musTimer = null;
  const last = {};
  const now = () => ac.currentTime;
  function throttle(name, ms) {
    const t = performance.now();
    if (last[name] && t - last[name] < ms) return false;
    last[name] = t; return true;
  }
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { console.warn('Web Audio API 미지원 브라우저: 소리 없이 진행'); return; }
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.85;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
    comp.connect(master); master.connect(ac.destination);
    sfxG = ac.createGain(); sfxG.gain.value = SAVE.set.sfx ? 1 : 0; sfxG.connect(comp);
    musG = ac.createGain(); musG.gain.value = 0.32; musG.connect(comp);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (SAVE.set.music) startMusic();
  }
  function env(g, t0, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
  }
  function noise({ dur = 0.3, type = 'lowpass', f = 1000, f2 = 0, q = 1, gain = 0.4, a = 0.005, t = 0, dest = null }) {
    if (!ac) return;
    const t0 = now() + t;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const flt = ac.createBiquadFilter(); flt.type = type; flt.frequency.setValueAtTime(f, t0); flt.Q.value = q;
    if (f2) flt.frequency.exponentialRampToValueAtTime(f2, t0 + a + dur);
    const g = ac.createGain(); env(g, t0, a, gain, dur);
    src.connect(flt); flt.connect(g); g.connect(dest || sfxG);
    src.start(t0, Math.random() * 1.5); src.stop(t0 + a + dur + 0.05);
  }
  function tone({ f = 440, f2 = 0, dur = 0.3, type = 'sine', gain = 0.3, a = 0.005, t = 0, dest = null, lp = 0, detune = 0 }) {
    if (!ac) return;
    const t0 = now() + t;
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t0); o.detune.value = detune;
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + a + dur);
    const g = ac.createGain(); env(g, t0, a, gain, dur);
    let node = o;
    if (lp) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); node = fl; }
    node.connect(g); g.connect(dest || sfxG);
    o.start(t0); o.stop(t0 + a + dur + 0.05);
  }

  // --- 공성 효과음 ---
  function creak(len = 0.55) {         // 팽팽하게 당겨진 로프 삐걱-
    if (!ac) return;
    for (let i = 0; i < 8; i++) {
      const t = i * len / 8 + Math.random() * 0.03;
      tone({ f: 150 + Math.random() * 130, f2: 110 + Math.random() * 60, dur: 0.07, type: 'sawtooth', gain: 0.07, t, lp: 1000 });
      noise({ dur: 0.05, type: 'bandpass', f: 1600 + Math.random() * 800, q: 8, gain: 0.05, t });
    }
  }
  function release() {                 // 릴리즈 핀 쾅-
    tone({ f: 95, f2: 38, dur: 0.3, gain: 0.65 });
    noise({ dur: 0.18, type: 'lowpass', f: 600, f2: 120, gain: 0.5 });
    noise({ dur: 0.03, type: 'highpass', f: 3000, gain: 0.25 });
  }
  function twang() {                   // 발리스타 시위
    tone({ f: 180, f2: 90, dur: 0.35, type: 'triangle', gain: 0.35 });
    tone({ f: 360, f2: 200, dur: 0.2, type: 'sawtooth', gain: 0.08, lp: 1500 });
    noise({ dur: 0.04, type: 'highpass', f: 2500, gain: 0.2 });
  }
  function rumbleCart() { noise({ dur: 0.7, type: 'lowpass', f: 300, f2: 120, gain: 0.35, a: 0.05 }); }
  function whooshStart() {             // 휘이익- 풍절음
    if (!ac || wh) return;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const flt = ac.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.value = 500; flt.Q.value = 1.6;
    const g = ac.createGain(); g.gain.value = 0;
    src.connect(flt); flt.connect(g); g.connect(sfxG); src.start();
    wh = { src, flt, g };
  }
  function whooshSet(speed) {
    if (!wh) return;
    const v = clamp(speed / 950, 0, 1);
    wh.g.gain.setTargetAtTime(v * v * 0.25, now(), 0.05);
    wh.flt.frequency.setTargetAtTime(280 + v * 1500, now(), 0.05);
  }
  function whooshStop() {
    if (!wh) return;
    const w = wh; wh = null;
    w.g.gain.setTargetAtTime(0, now(), 0.06);
    setTimeout(() => { try { w.src.stop(); } catch (e) { /* 이미 정지됨 */ } }, 400);
  }
  function impact(energy, mat) {       // 블록 충돌
    if (!ac || !throttle('imp', 35)) return;
    const v = clamp(Math.log10(energy + 1) / 6, 0.05, 1);

// ======================================================================
//  30개 요새 생성기 (스테이지 번호로 시드 고정 → 항상 같은 요새)
// ======================================================================

    roles.forEach((r, i) => unit(r, fl.lx + span * (i + 1) / (n + 1), fl.y));
  };

  // 탑: 좌우 기둥 + 층판 반복, 상단은 지붕(roof) / 총안(crenel) / 방호 차양(hoarding)

    }
    const top = floors[floors.length - 1];
    if (o.top === 'roof') {
      blk('thatch', lx - over - 4, y, w + over * 2 + 8, 14);
      blk('thatch', lx + w * 0.18, y - 14, w * 0.64, 14);

      put(rt.floors[rt.floors.length - 1], ['soldier']); x += 76;

    if (boss) {

      const t2 = tower(x, GY, 90, { levels: 5, colMat: 'stone', plankMat: 'stone', colW: 20, lvlH: 58, pH: 12, top: 'crenel', banner: '#a3312a' });

      levels: 4 + (boss ? 1 : 0), colMat: idx === 29 ? 'iron' : 'granite', plankMat: idx === 29 ? 'granite' : (t > 0.5 ? 'stone' : 'wood'),

    });

    put(kf[kf.length - 1], ['soldier', 'soldier']);
    put(kf[1], ['soldier']);
    x += kw + Math.round(R(40, 60));
    const rt = tower(x, base, 80, { levels: 3, colMat: 'stone', plankMat: t > 0.4 ? 'iron' : 'wood', colW: 18, lvlH: 60, pH: 12, top: 'crenel', banner: '#2f5fa8' });
    put(rt.floors[rt.floors.length - 1], ['soldier']);
    if (t > 0.5) put(rt.floors[1], ['soldier']);
    x += 80;
    if (boss) {
      x += 40;
      const t2 = tower(x, base, 96, { levels: 5, colMat: 'granite', plankMat: 'iron', colW: 22, lvlH: 56, pH: 12, top: 'hoarding', banner: '#1d1d1d' });

}

const MANG = { px: ENGINE_X + 6, py: GY - 34, len: 64 };
function mangArm(t) { return (172 + 93 * Math.pow(clamp(t, 0, 1), 1.4)) * DEG; }
function mangonelTip(t) { const p = mangArm(t); return { x: MANG.px + Math.cos(p) * MANG.len, y: MANG.py + Math.sin(p) * MANG.len, phi: p }; }
function ballistaTip(angle) { const a = angle * DEG; return { x: ENGINE_X + 10 + Math.cos(a) * 44, y: GY - 58 - Math.sin(a) * 44 }; }
const heavyAmmo = id => has('a_iron') && (id === 'boulder' || id === 'ap');

function launchSpeed(eng, cw, sling, ammoId) {
  const a = AMMO_BY[ammoId] || AMMO[0];
  const winch = has('m_winch') ? 1.1 : 1;
  if (eng === 'trebuchet') {
    const m = a.mass * (heavyAmmo(ammoId) ? 1.3 : 1);
    const mult = 1 + (has('e_arm') ? 0.08 : 0) + (has('e_great') ? 0.10 : 0);
    return 520 * Math.sqrt(cw * winch * (0.6 + 0.1 * sling) / (m + 4)) * mult;
  }
  if (eng === 'mangonel') return 360 * Math.sqrt(cw * winch * 0.9 / (a.mass * 0.45 + 3));
  if (eng === 'ballista') return (300 + 16 * cw) * Math.sqrt(winch);
  return 120 + 9 * cw * Math.sqrt(winch);
}
function launchOrigin(E) {
  if (E.engine === 'trebuchet') return trebPouch(0.82, E.sling);
  if (E.engine === 'mangonel') return mangonelTip(1);
  if (E.engine === 'ballista') return ballistaTip(E.angle);
  return { x: ENGINE_X + 70, y: GY - 16 };
}
function projDrag(eng, a) { return eng === 'ballista' ? a.drag * 0.35 : eng === 'mangonel' ? a.drag * 1.25 : a.drag; }

let BT = null;
const UNIT_DEF = { soldier: { w: 10, h: 20, hp: 1, morale: 100 }, lord: { w: 12, h: 24, hp: 2.6, morale: 170 } };

const HOOKS = {
  forces(b, dt) {
    if (b.drag) {
      const wx = BT.wind * PPM * (b.windMul ?? 1);
      const rvx = b.vx - wx, rvy = b.vy, sp = Math.hypot(rvx, rvy);
      b.vx -= b.drag * sp * rvx * dt; b.vy -= b.drag * sp * rvy * dt;
    }
    // 착탄 후 구르는 탄환의 구름 저항 (평지에서 영원히 구르지 않도록)
    if (b.impacted && b.shape === 'circle') { const k = Math.max(0, 1 - 0.9 * dt); b.vx *= k; b.av *= k; }
    const W = BT.S.water;
    // 충차는 해자를 건너지 못하고 앞바퀴부터 빠진다
    if (b.ram && W && b.x > W.x1 - 10 && b.x < W.x2 + 30 && b.y < W.top) {
      b.vy += 900 * dt; b.vx *= Math.max(0, 1 - 1.5 * dt); b.av += 2.5 * dt;
      if (!b.moatMsg) { b.moatMsg = true; floater(b.x, b.y - 30, '충차가 해자에 빠졌다!', '#9fd0ff'); }
    }
    if (W && b.x > W.x1 && b.x < W.x2 && b.y > W.top) {
      if (!b.inWater) { b.inWater = true; if (b.speed > 60) splashAt(b.x, W.top, Math.min(1.5, b.mass / 6)); }
      const k = Math.max(0, 1 - 3 * dt);
      b.vx *= k; b.vy *= k; b.av *= Math.max(0, 1 - 4 * dt);
      b.vy -= G * dt * Math.min(1.5, 1 / Math.max(0.3, b.dens));
    } else b.inWater = false;
  },
  pairOk(A, B) {
    const pa = A.kind === 'proj' || A.kind === 'shard', pb = B.kind === 'proj' || B.kind === 'shard';
    return !(pa && pb);
  },
  // 관통 철갑탄/볼트: 부술 수 있는 블록·병사는 충돌 대신 관통
  pierce(A, B) {
    let p = null, o = null;
    if (A.kind === 'proj' && A.pierce > 0) { p = A; o = B; } else if (B.kind === 'proj' && B.pierce > 0) { p = B; o = A; }
    if (!p || o.isStatic || p.removed) return false;
    if (BT.breakQ.has(o)) return true;
    if (o.kind === 'unit') {
      if (o.alive && p.speed > 150) { killUnit(o, 'pierce'); p.vx *= 0.94; p.vy *= 0.94; return true; }
      return false;
    }
    if (o.kind !== 'block' || o.removed) return false;
    const rv = Math.hypot(p.vx - o.vx, p.vy - o.vy);
    if (rv < 200) return false;
    const mu = p.mass * o.mass / (p.mass + o.mass);
    const dmg = 0.5 * mu * (rv - V_DMG) ** 2 * DMG_K * p.dmgMult;
    if (dmg < o.hp) return false;
    p.pierce--; p.vx *= 0.82; p.vy *= 0.82;
    o.hp = 0; queueBreak(o);
    floater(o.x, o.y - 14, '관통!', '#d6e0ff', 0.9);
    return true;
  },
};

function addTerrain(S) {
  const add = (x0, y0, x1, y1, style) => {
    const b = addBody(new Body({ x: (x0 + x1) / 2, y: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0, isStatic: true, kind: 'static', friction: 0.85 }));
    b.style = style; return b;
  };
  const L = -500, Rr = S.W + 500;
  if (S.water) {
    add(L, GY, S.water.x1, GY + 400, 'ground');
    add(S.water.x1, S.water.bottom, S.water.x2, GY + 400, 'pit');
    add(S.water.x2, GY, Rr, GY + 400, 'ground');
  } else add(L, GY, Rr, GY + 400, 'ground');
  if (S.cliff) add(S.cliff.x, S.cliff.top, Rr, GY + 2, 'cliff');
}
function groundAt(x) {
  const S = BT.S;
  if (S.cliff && x > S.cliff.x) return S.cliff.top;
  if (S.water && x > S.water.x1 && x < S.water.x2) return S.water.bottom;
  return GY;
}

  BT = {

    shotsMax: S.shots + (has('m_mag1') ? 1 : 0) + (has('t_mag2') ? 1 : 0), shotsUsed: 0,
    wind: 0, state: 'aim', reload: 0, reloadMax: 1, engAnim: 0, launch: null, main: [], flightT: 0, firstHitT: -1,
    trail: [], prevTrail: null, shake: 0, time: 0, endT: 0, quietT: 0, idleT: 0, result: null,
    initValue: 0, destr: 0, destroyed: new Set(), lordDead: false, breakQ: new Set(),

  };
  world.hooks = HOOKS;

    const b = addBody(new Body({ x: s.x, y: s.y, w: s.w, h: s.h, mat: s.mat, kind: 'block', hp: m.hp, sleeping: true, friction: s.mat === 'iron' ? 0.55 : 0.72, rest: 0.04 }));
    b.origin = b.id; b.banner = s.banner || null; b.grate = !!s.grate; b.burn = 0; b.charred = false; b.strMul = 1; b.stress = 0;
    BT.blocks.push(b);
    const val = b.mass * m.value;

  for (const u of S.units) {

    const b = addBody(new Body({ x: u.x, y: u.y, w: d.w, h: d.h, kind: 'unit', dens: 0.9, friction: 0.85, rest: 0, sleeping: true, hp: d.hp }));
    b.role = u.role; b.alive = true; b.morale = d.morale; b.anim = Math.random() * 10; b.waterT = 0;
    BT.units.push(b);
  }

}

function newWind() {
  const m = BT.S.maxWind;
  BT.wind = Math.round(rand(-1, 1) * m * 10) / 10;
}

// ---------------------------------------------------------------- 발사
function fire() {
  if (!BT || BT.result) return;
  if (BT.state === 'flight') { burstAll(); return; }
  if (BT.state !== 'aim' || BT.reload > 0) return;
  if (BT.shotsUsed >= BT.shotsMax) { toast('탄환이 모두 소진되었습니다'); return; }
  SFX.init();
  const E = SAVE.eng;
  if (!engineUnlocked(E.engine)) return;
  const ammo = E.engine === 'ram' ? 'boulder' : (ammoUnlocked(E.ammo) ? E.ammo : 'boulder');
  BT.launch = { eng: E.engine, ammo, angle: E.engine === 'ram' ? 0 : E.angle, cw: E.cw, sling: E.sling, v: launchSpeed(E.engine, E.cw, E.sling, ammo), released: false };
  BT.state = 'launching'; BT.engAnim = 0; BT.shotsUsed++; SAVE.stats.shots++;
  if (E.engine === 'trebuchet' || E.engine === 'mangonel') SFX.creak(E.engine === 'trebuchet' ? 0.6 : 0.3);
  else if (E.engine === 'ram') SFX.rumbleCart();
  updateHUD(true); syncPanel();
}
function updateLaunch(dt) {
  const L = BT.launch;
  if (!L || BT.state === 'reload' || BT.state === 'aim') return;
  const dur = { trebuchet: 0.95, mangonel: 0.4, ballista: 0.22, ram: 0.25 }[L.eng];
  BT.engAnim = Math.min(1.25, BT.engAnim + dt / dur);
  const rel = { trebuchet: 0.82, mangonel: 0.95, ballista: 0.5, ram: 0.3 }[L.eng];
  if (!L.released && BT.engAnim >= rel) { L.released = true; spawnShot(L); }
}
function spawnShot(L) {
  const a = AMMO_BY[L.ammo], ang = L.angle * DEG, dx = Math.cos(ang), dy = -Math.sin(ang);
  if (BT.trail.length > 3) BT.prevTrail = BT.trail;
  BT.trail = []; BT.main = []; BT.flightT = 0; BT.firstHitT = -1;
  const mk = o => { const b = addBody(new Body(o)); BT.projs.push(b); BT.main.push(b); return b; };
  const common = b => {
    b.ammo = L.ammo; b.impacted = false; b.born = BT.time;
    b.dmgMult = a.dmg * (heavyAmmo(L.ammo) ? 1.25 : 1); b.unitMult = a.unit; b.pierce = a.pierce || 0;
  };
  if (L.eng === 'ram') {
    const b = mk({ x: ENGINE_X + 70, y: GY - 16, w: 96, h: 30, kind: 'proj', mass: 22, friction: 0.04, rest: 0.1, dens: 1.2 });
    common(b); b.ram = true; b.ammo = 'ram'; b.dmgMult = 1.6; b.unitMult = 2; b.pierce = 0; b.vx = L.v;
    SFX.release();
  } else if (L.eng === 'mangonel') {
    const n = has('e_volley') ? 4 : 3, p = mangonelTip(1);
    for (let i = 0; i < n; i++) {
      const sa = ang + (i - (n - 1) / 2) * 2.2 * DEG + rand(-0.6, 0.6) * DEG, sv = L.v * rand(0.96, 1.04);
      const b = mk({ shape: 'circle', x: p.x + rand(-3, 3), y: p.y + rand(-3, 3), r: a.r * 0.66, kind: 'proj', mass: a.mass * 0.45, drag: projDrag('mangonel', a), friction: 0.5, rest: 0.25, dens: 2.5 });
      common(b); b.small = true; b.vx = Math.cos(sa) * sv; b.vy = -Math.sin(sa) * sv;
    }
    SFX.release();
  } else if (L.eng === 'ballista') {
    const p = ballistaTip(L.angle);
    const b = mk({ shape: 'circle', x: p.x, y: p.y, r: 6, kind: 'proj', mass: a.mass * 0.7, drag: projDrag('ballista', a), friction: 0.3, rest: 0.1, dens: 3 });
    common(b); b.bolt = true; b.windMul = 0.35; b.pierce = (a.pierce || 0) + 1 + (has('e_volley') ? 1 : 0);
    b.vx = dx * L.v; b.vy = dy * L.v;
    SFX.twang();
  } else {
    const p = trebPouch(0.82, L.sling);
    const b = mk({ shape: 'circle', x: p.x, y: p.y, r: a.r, kind: 'proj', mass: a.mass * (heavyAmmo(L.ammo) ? 1.3 : 1), drag: a.drag, friction: 0.6, rest: 0.2, dens: 2.5 });
    common(b); b.vx = dx * L.v; b.vy = dy * L.v;
    SFX.release();
  }

  BT.burstReady = L.ammo === 'shrapnel';
  SFX.whooshStart();
}
function burstAll() {
  if (!BT.burstReady) return;
  let any = false;
  for (const b of BT.main) if (b.ammo === 'shrapnel' && !b.burst && !b.removed && !b.impacted) { burstShrapnel(b); any = true; }
  if (any) BT.burstReady = false;
}
function updateFlight(dt) {
  if (BT.state !== 'flight') return;
  BT.flightT += dt;
  const alive = BT.main.filter(b => !b.removed);
  const lead = alive.find(b => !b.impacted) || alive[0];
  if (lead) {
    const lp = BT.trail[BT.trail.length - 1];
    if (!lead.impacted && (!lp || Math.hypot(lead.x - lp[0], lead.y - lp[1]) > 7)) BT.trail.push([lead.x, lead.y]);
    SFX.whooshSet(lead.impacted ? 0 : lead.speed);
    BT.cam.follow = lead.x;
  }
  for (const b of alive) {
    if (b.ammo === 'shrapnel' && !b.burst && !b.impacted) {
      if (b.vy > 0) b.desc = (b.desc || 0) + dt;
      // 하강 중 수비병 머리 위에 다다르면 자동 근접 폭발 (SPACE로 수동 폭발 가능)
      const near = b.vy > 0 && BT.units.some(u => u.alive && Math.abs(u.x - b.x) < 70 && u.y - b.y > 20 && u.y - b.y < 110);
      if (b.desc > 1.3 || near) burstShrapnel(b);
    }
    if (b.ammo === 'fire' && !b.impacted && Math.random() < 0.8) addPart({ type: 'flame', x: b.x, y: b.y, vx: rand(-20, 20), vy: rand(-30, 0), life: 0.45, max: 0.45, size: rand(5, 9) });
    if (b.ammo === 'gas' && !b.impacted && Math.random() < 0.5) addPart({ type: 'gas', x: b.x, y: b.y, vx: 0, vy: 0, life: 0.6, max: 0.6, size: 6 });
  }
  const settled = b => b.removed || b.sleeping || b.x > BT.W + 300 || b.x < -300 ||
    (b.impacted && (b.speed < 40 || BT.time - b.impactT > 2.4));
  // 공중 폭발로 탄환이 쇳조각으로 바뀌었을 수 있으므로 다시 집계
  const now = BT.main.filter(b => !b.removed);

function endFlight() {
  SFX.whooshStop();
  BT.state = 'reload';
  BT.reloadMax = BT.reload = ENGINE_BY[BT.launch.eng].reload * (has('m_gear') ? 0.7 : 1);
  BT.cam.follow = null; BT.cam.hold = 1.0;
  BT.burstReady = false;
  newWind();
  saveGame();
}
function updateReload(dt) {
  if (BT.state !== 'reload') return;
  BT.reload -= dt;
  BT.engAnim = Math.max(0, BT.reload / BT.reloadMax) * 1.25;
  if (BT.reload <= 0) {
    BT.reload = 0; BT.state = 'aim'; BT.engAnim = 0; BT.launch = null;
    computeLoads(false); syncPanel();
  }
}

// ---------------------------------------------------------------- 충돌 결과 처리
function processEvents() {
  const ev = world.events; world.events = [];
  for (const e of ev) {
    const { a, b, v, x, y } = e;
    if (a.removed || b.removed) continue;
    if (a.kind === 'proj' && !a.impacted && b.kind !== 'proj' && b.kind !== 'shard') projImpact(a, b, v, x, y);
    else if (b.kind === 'proj' && !b.impacted && a.kind !== 'proj' && a.kind !== 'shard') projImpact(b, a, v, x, y);
    impactDamage(a, b, v, x, y);
  }
}
const isShot = b => b.kind === 'proj' || b.kind === 'shard';
function impactDamage(a, b, v, x, y) {
  const mu = a.isStatic ? b.mass : b.isStatic ? a.mass : a.mass * b.mass / (a.mass + b.mass);
  if (v > V_DMG) {
    const E = 0.5 * mu * (v - V_DMG) ** 2;
    const base = E * DMG_K;
    if (a.kind === 'block') hurtBlock(a, base * (isShot(b) ? b.dmgMult : 1));
    if (b.kind === 'block') hurtBlock(b, base * (isShot(a) ? a.dmgMult : 1));
    if (E > 3000) {
      const mat = a.kind === 'block' ? a.mat : b.kind === 'block' ? b.mat : 'stone';
      SFX.impact(E, mat);
      BT.impactLog.push(BT.time);
      if (E > 25000) dustAt(x, y, Math.min(8, E / 30000), mat);
    }
    if (E > 150000) BT.shake = Math.max(BT.shake, Math.min(14, E / 40000));
  }
  if (v > 50) {
    const d = mu * (v - 50) * 0.02;
    if (a.kind === 'unit') hurtUnit(a, d * (isShot(b) ? b.unitMult : 1));
    if (b.kind === 'unit') hurtUnit(b, d * (isShot(a) ? a.unitMult : 1));
  }
}
function hurtBlock(b, d) {
  if (d < 0.5 || b.removed) return;
  b.hp -= d; b.hitT = BT.time;
  if (b.hp <= 0) queueBreak(b);
}
function hurtUnit(u, d) {
  if (!u.alive || d < 0.05) return;
  u.hp -= d; u.hitT = BT.time;
  if (u.hp <= 0) killUnit(u, 'hit');
}
function queueBreak(b) { if (!b.removed) BT.breakQ.add(b); }

function projImpact(p, o, v, x, y) {
  p.impacted = true; p.impactT = BT.time;
  if (BT.firstHitT < 0) BT.firstHitT = BT.time;
  const KE = 0.5 * p.mass * v * v;
  if (p.ammo === 'gas') { releaseGas(x, y); p.removed = true; return; }
  if (p.ammo === 'shrapnel' && !p.burst) { burstShrapnel(p); return; }
  if (p.ammo === 'fire') ignite(x, y);
  if (p.ram) { if (KE > 2e5) shockwave(x, y, KE * 0.4, p); return; }
  if (p.inWater) return;
  shockwave(x, y, KE * (p.small ? 0.6 : p.ammo === 'fire' ? 0.5 : 1), p);
}
// 착탄 2차 충격파: 주변 물체 넉백 + 보병 피해
function shockwave(x, y, KE, src) {
  const pw = has('t_powder1') ? 1.3 : 1;
  const R = (40 + Math.min(90, Math.sqrt(KE) * 0.055)) * pw;
  const J = Math.sqrt(KE) * 0.05 * pw;
  for (const b of world.bodies) {
    if (b.isStatic || b === src || b.removed || b.kind === 'shard' || b.kind === 'proj') continue;
    const dx = b.x - x, dy = b.y - y, d = Math.hypot(dx, dy);
    if (d > R || d < 0.001) continue;
    const f = 1 - d / R;
    b.wake();
    const dv = Math.min(240, J * f / Math.max(0.5, b.mass) * (b.kind === 'unit' ? 3 : 1));
    b.vx += dx / d * dv; b.vy += dy / d * dv - dv * 0.3; b.av += rand(-1, 1) * f * 1.5;
    if (b.kind === 'unit') hurtUnit(b, f * 1.7 * pw);
    else if (b.kind === 'block') hurtBlock(b, f * 18 * pw);
  }
  addPart({ type: 'ring', x, y, vx: 0, vy: 0, life: 0.45, max: 0.45, size: R });
  dustAt(x, y, 3 + Math.min(6, KE / 3e5), 'stone');
  BT.shake = Math.max(BT.shake, Math.min(12, KE / 2.5e5));
}
function burstShrapnel(p) {
  if (p.removed || p.burst) return;
  p.burst = true; p.removed = true; p.impacted = true; p.impactT = BT.time;
  const n = 14 + (has('t_powder2') ? 8 : 0), spread = has('t_powder2') ? 320 : 260;
  for (let i = 0; i < n; i++) {
    const ang = rand(0, Math.PI * 2), sp = rand(0.4, 1) * spread;
    const b = addBody(new Body({ shape: 'circle', x: p.x + Math.cos(ang) * 4, y: p.y + Math.sin(ang) * 4, r: 3.5, kind: 'shard', mass: 0.8, drag: 2.5e-4, friction: 0.4, rest: 0.3, dens: 4 }));
    b.vx = p.vx * 0.75 + Math.cos(ang) * sp; b.vy = p.vy * 0.75 + Math.sin(ang) * sp;
    b.born = BT.time; b.dmgMult = 0.4; b.unitMult = 3; b.life = 5; b.impacted = true; b.impactT = BT.time;
    BT.projs.push(b); BT.main.push(b);
  }
  addPart({ type: 'flash', x: p.x, y: p.y, vx: 0, vy: 0, life: 0.25, max: 0.25, size: 60 });
  for (let i = 0; i < 10; i++) addPart({ type: 'smoke', x: p.x + rand(-10, 10), y: p.y + rand(-10, 10), vx: rand(-40, 40), vy: rand(-40, 10), life: 1.2, max: 1.2, size: rand(10, 18) });
  SFX.burst(); BT.shake = Math.max(BT.shake, 6);
  floater(p.x, p.y - 20, '산탄 폭발!', '#ffd08a');
}
function ignite(x, y) {
  const greek = has('a_greek'), R = 85 * (greek ? 1.5 : 1);
  let n = 0;
  for (const b of BT.blocks) {
    if (b.removed || !MATS[b.mat].flam || b.charred) continue;
    b.aabb();
    const dx = Math.max(b.minX - x, 0, x - b.maxX), dy = Math.max(b.minY - y, 0, y - b.maxY);
    if (dx * dx + dy * dy < R * R) { b.burn = MATS[b.mat].burnTime * (greek ? 1.3 : 1); n++; }
  }
  for (const u of BT.units) if (u.alive && Math.hypot(u.x - x, u.y - y) < R * 0.6) hurtUnit(u, 1.2);
  BT.gfires.push({ x, y: Math.min(y, groundAt(x)), t: 0, dur: 3.5 });

}

function killUnit(u, cause) {

// ---------------------------------------------------------------- 파괴·분열
function processBreaks() {
  if (!BT.breakQ.size) return;
  const list = [...BT.breakQ]; BT.breakQ.clear();
  for (const b of list) {
    if (b.removed) continue;
    b.removed = true; BT.blocksBroken++; SAVE.stats.blocks++;
    BT.destroyed.add(b.origin);
    b.aabb();
    wakeRegion(b.minX - 6, b.minY - 10, b.maxX + 6, b.maxY + 6);
    spawnDebris(b);
    const area = b.hw * b.hh * 4;
    if (area >= 600 && world.bodies.length < MAX_BODIES && Math.min(b.hw, b.hh) * 2 >= 8) splitBlock(b);
    SFX.crumble(b.mat);
    BT.impactLog.push(BT.time, BT.time);
  }
}
function splitBlock(b) {
  const c = Math.cos(b.a), s = Math.sin(b.a), alongX = b.hw >= b.hh;
  const nhw = alongX ? b.hw / 2 : b.hw, nhh = alongX ? b.hh : b.hh / 2;
  for (const sgn of [-1, 1]) {
    const lx = alongX ? sgn * nhw : 0, ly = alongX ? 0 : sgn * nhh;
    const ox = c * lx - s * ly, oy = s * lx + c * ly;
    const nb = addBody(new Body({ x: b.x + ox, y: b.y + oy, a: b.a, w: nhw * 2 - 1, h: nhh * 2 - 1, mat: b.mat, kind: 'block', hp: MATS[b.mat].hp * 0.4, friction: b.friction, rest: b.rest }));
    const ol = Math.hypot(ox, oy) || 1;
    nb.vx = b.vx + ox / ol * rand(10, 35); nb.vy = b.vy + oy / ol * rand(10, 35) - rand(0, 20); nb.av = b.av + rand(-1.5, 1.5);
    nb.origin = b.origin; nb.frag = true; nb.burn = b.burn; nb.charred = b.charred; nb.strMul = 1; nb.stress = 0; nb.grate = b.grate; nb.corroded = b.corroded;
    BT.blocks.push(nb);
  }
}
function spawnDebris(b) {
  const m = MATS[b.mat], area = b.hw * b.hh * 4, n = clamp(Math.round(area / 110), 4, 16);
  for (let i = 0; i < n; i++) {
    addPart({ type: 'chunk', x: b.x + rand(-b.hw, b.hw) * 0.8, y: b.y + rand(-b.hh, b.hh) * 0.8, vx: b.vx * 0.5 + rand(-120, 120), vy: b.vy * 0.5 + rand(-200, -20),
      life: rand(1.5, 3), max: 3, size: rand(2.5, 6), color: i % 3 ? m.chip : m.color, rot: rand(0, 6), vr: rand(-12, 12) });
  }
  dustAt(b.x, b.y, 2 + area / 400, b.mat);
}
function dustAt(x, y, k, mat) {
  const col = mat === 'wood' || mat === 'thatch' ? '#c9a878' : '#c8c2b6';
  for (let i = 0; i < k * 2; i++) addPart({ type: 'dust', x: x + rand(-10, 10), y: y + rand(-6, 6), vx: rand(-60, 60), vy: rand(-60, 10), life: rand(0.8, 1.6), max: 1.6, size: rand(6, 14), color: col });
}

// ---------------------------------------------------------------- 하중(구조 응력) 분석
// 위에서 아래로 접촉면 겹침 비율에 따라 무게를 분배 → 블록별 지지 하중/허용 하중 비율
function computeLoads(initial) {
  const L = BT.blocks.filter(b => !b.removed);
  for (const b of L) { b.aabb(); b.load = b.mass; b.carry = 0; }
  const us = BT.units.filter(u => u.alive);
  for (const u of us) { u.aabb(); u.load = u.mass; }
  const items = L.concat(us).sort((p, q) => p.minY - q.minY);
  const sup = [];
  for (const b of items) {
    if (b.speed > 25) continue;
    sup.length = 0; let tot = 0;
    for (const s of L) {
      if (s === b || Math.abs(s.minY - b.maxY) > 3.5) continue;
      const ov = Math.min(s.maxX, b.maxX) - Math.max(s.minX, b.minX);
      if (ov > 1) { sup.push(s, ov); tot += ov; }
    }
    for (let i = 0; i < sup.length; i += 2) { const sh = b.load * sup[i + 1] / tot; sup[i].load += sh; sup[i].carry += sh; }
  }
  for (const b of L) {
    const cap = (b.maxX - b.minX) * MATS[b.mat].str * 0.4;
    const r0 = b.carry / cap;
    if (initial && r0 > 0.55) b.strMul = r0 / 0.55;
    b.stress = r0 / (b.strMul * Math.max(0.12, b.hp / b.maxHp));
  }
  BT.weak = L.filter(b => b.carry > 0).sort((p, q) => q.carry * (q.stress + 0.2) - p.carry * (p.stress + 0.2)).slice(0, 3);
}
function crushOverloaded() {
  for (const b of BT.blocks) {
    if (b.removed || b.stress <= 1) continue;
    hurtBlock(b, (b.stress - 1) * b.maxHp * 0.3 + 4);
    b.wake();
    if (Math.random() < 0.5) dustAt(b.x, b.y + b.hh, 1, b.mat);
  }
}

// ---------------------------------------------------------------- 화재·가스
function updateFires(dt) {
  BT.spreadT -= dt;
  const doSpread = BT.spreadT <= 0;
  if (doSpread) BT.spreadT = 0.4;
  const burnMul = has('a_greek') ? 2 : 1;
  let active = 0;
  for (const b of BT.blocks) {
    if (b.removed || b.burn <= 0) continue;
    active++;
    const m = MATS[b.mat];
    b.burn -= dt; b.hp -= m.burnRate * burnMul * dt;
    if (b.hp <= 0) { queueBreak(b); continue; }
    if (b.burn <= 0) { b.burn = 0; b.charred = true; continue; }
    if (Math.random() < dt * 16) {
      const c = Math.cos(b.a), s = Math.sin(b.a), lx = rand(-b.hw, b.hw), ly = rand(-b.hh, b.hh);
      addPart({ type: 'flame', x: b.x + c * lx - s * ly, y: b.y + s * lx + c * ly, vx: rand(-15, 15) + BT.wind * 3, vy: rand(-70, -30), life: rand(0.4, 0.8), max: 0.8, size: rand(5, 10) });
    }
    if (Math.random() < dt * 3) addPart({ type: 'smoke', x: b.x, y: b.y - b.hh, vx: BT.wind * 5 + rand(-10, 10), vy: rand(-40, -20), life: 2.5, max: 2.5, size: rand(10, 18) });
    if (doSpread) {
      b.aabb(8);
      const x0 = b.minX, x1 = b.maxX, y0 = b.minY, y1 = b.maxY;
      for (const o of BT.blocks) {
        if (o === b || o.removed || o.burn > 0 || o.charred || !MATS[o.mat].flam) continue;
        o.aabb();
        if (o.maxX < x0 || o.minX > x1 || o.maxY < y0 || o.minY > y1) continue;
        if (Math.random() < MATS[o.mat].flam * 0.3) o.burn = MATS[o.mat].burnTime;
      }
      for (const u of BT.units) {
        if (!u.alive || u.x < x0 - 4 || u.x > x1 + 4 || u.y < y0 - 4 || u.y > y1 + 4) continue;
        u.hp -= 0.35; u.burnT = BT.time;
        if (u.hp <= 0) killUnit(u, 'fire');
      }
    }
  }
  BT.firesActive = active;
  if (active && Math.random() < dt * 8) SFX.crackle();
  for (const f of BT.gfires) {
    f.t += dt;
    if (Math.random() < dt * 20) addPart({ type: 'flame', x: f.x + rand(-22, 22), y: f.y - 2, vx: rand(-10, 10), vy: rand(-80, -30), life: 0.6, max: 0.6, size: rand(5, 9) });
  }
  BT.gfires = BT.gfires.filter(f => f.t < f.dur);
}
function updateGas(dt) {
  const mm = has('t_morale') ? 1.5 : 1;
  for (const g of BT.gas) {
    g.t += dt; g.r = Math.min(g.R, g.r + 160 * dt); g.x += BT.wind * PPM * 0.2 * dt;
    const fade = g.t > g.dur - 1.5 ? Math.max(0, (g.dur - g.t) / 1.5) : 1, rr = g.r * fade;
    for (const u of BT.units) {
      if (!u.alive || Math.hypot(u.x - g.x, u.y - g.y) > rr) continue;
      u.morale -= 28 * mm * dt; u.gasT = BT.time;
      if (u.morale <= 0) surrenderUnit(u);
    }
    for (const b of BT.blocks) {
      if (b.removed || Math.hypot(b.x - g.x, b.y - g.y) > rr) continue;
      const c = b.mat === 'iron' ? 16 : (b.mat === 'stone' || b.mat === 'granite') ? 1.5 : 0.8;
      b.hp -= c * dt; b.corroded = true;
      if (b.hp <= 0) queueBreak(b);
    }
    if (Math.random() < dt * 14 * fade) {
      const a = rand(0, 6.283), d = rand(0, rr);
      addPart({ type: 'gas', x: g.x + Math.cos(a) * d, y: g.y + Math.sin(a) * d * 0.6, vx: rand(-8, 8) + BT.wind * 2, vy: rand(-12, 4), life: 1.8, max: 1.8, size: rand(18, 34) });
    }
  }
  BT.gas = BT.gas.filter(g => g.t < g.dur);
}

// ---------------------------------------------------------------- 파티클·부유 텍스트
function addPart(p) { if (!BT) return; if (BT.parts.length > 900) BT.parts.shift(); BT.parts.push(p); }
function floater(x, y, text, color = '#fff', scale = 1) { if (BT) BT.floats.push({ x, y, text, color, life: 1.6, max: 1.6, scale }); }
function updateParticles(dt) {
  for (const p of BT.parts) {
    p.life -= dt;
    switch (p.type) {
      case 'chunk': case 'splash': {
        p.vy += G * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.rot !== undefined) p.rot += p.vr * dt;
        const gy = groundAt(p.x);
        if (p.y > gy - 1 && p.type === 'chunk') { p.y = gy - 1; p.vy *= -0.3; p.vx *= 0.6; p.vr *= 0.6; }
        if (p.type === 'splash' && BT.S.water && p.y > BT.S.water.top && p.vy > 0) p.life = 0;
        break;
      }
      case 'flame': p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 30 * dt; break;
      case 'smoke': case 'dust': case 'gas': p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98; break;
      case 'whiteflag': p.y += p.vy * dt; break;
      default: break;
    }
  }
  BT.parts = BT.parts.filter(p => p.life > 0);
  for (const f of BT.floats) { f.life -= dt; f.y -= 22 * dt; }
  BT.floats = BT.floats.filter(f => f.life > 0);
}

// ---------------------------------------------------------------- 결과 판정
function calcDestr() {
  let lost = 0;
  for (const o of BT.originals) {
    if (BT.destroyed.has(o.id)) { lost += o.value; continue; }
    const b = o.body, a = Math.abs(((b.a % 6.2832) + 9.4248) % 6.2832 - 3.1416);
    if (Math.hypot(b.x - o.x0, b.y - o.y0) > 30 || (a > 0.5 && a < 2.64)) lost += o.value * 0.75;
  }
  BT.destr = Math.min(1, lost / BT.initValue);
}
function checkEnd(dt) {
  if (BT.result) return;
  const alive = BT.units.filter(u => u.alive).length;
  if (alive === 0) { BT.endT += dt; if (BT.endT > 1.8) victory(); return; }
  if (BT.shotsUsed >= BT.shotsMax && (BT.state === 'aim' || BT.state === 'reload')) {
    const busy = BT.firesActive > 0 || BT.gas.length > 0 || world.bodies.some(b => !b.isStatic && !b.sleeping && b.speed > 25);
    BT.quietT = busy ? 0 : BT.quietT + dt;
    BT.idleT += dt;
    if (BT.quietT > 1.6 || BT.idleT > 16) defeat();
  }
}
function victory() {
  calcDestr();
  const S = BT.S, idx = BT.idx;
  const stars = 1 + (BT.destr >= STAR_DESTR ? 1 : 0) + (BT.shotsUsed <= S.par ? 1 : 0);
  const prevStars = SAVE.stars[idx], first = !SAVE.cleared[idx];
  const base = 80 + 18 * (idx + 1), destrB = Math.round(BT.destr * 50), lordB = BT.lordDead ? 25 : 0, starB = stars * 30;
  let gold = base + destrB + lordB + starB;
  if (!first) gold = Math.round(gold * 0.35) + Math.max(0, stars - prevStars) * 30;
  if (has('t_royal')) gold = Math.round(gold * 1.3);
  SAVE.gold += gold;
  SAVE.stars[idx] = Math.max(prevStars, stars);
  SAVE.best[idx] = Math.max(SAVE.best[idx], Math.round(BT.destr * 100));
  SAVE.cleared[idx] = true;
  SAVE.lastStage = Math.min(29, idx + 1);
  saveGame();
  BT.result = { win: true, stars, gold, first, base, destrB, lordB, starB, replay: !first };
  SFX.whooshStop(); SFX.fanfare();
  setTimeout(showResult, 500);
}
function defeat() {
  calcDestr();
  BT.result = { win: false };
  saveGame();
  SFX.whooshStop(); SFX.defeat();
  setTimeout(showResult, 300);
}

// ---------------------------------------------------------------- 예상 궤적 (조준 사분의 / 바람 보정표)
function predictPath() {
  if (!has('m_quad') || !BT || BT.state !== 'aim') return null;
  const E = SAVE.eng;
  if (E.engine === 'ram') return null;
  const full = has('m_wind');
  const key = [E.engine, E.angle, E.cw, E.sling, E.ammo, full ? BT.wind : 0, has('a_iron')].join('|');
  if (key === BT.predKey) return BT.pred;
  const ammoId = ammoUnlocked(E.ammo) ? E.ammo : 'boulder', a = AMMO_BY[ammoId];
  const v = launchSpeed(E.engine, E.cw, E.sling, ammoId), p0 = launchOrigin(E), ang = E.angle * DEG;
  let x = p0.x, y = p0.y, vx = Math.cos(ang) * v, vy = -Math.sin(ang) * v;
  const drag = full ? projDrag(E.engine, a) : 0, wx = BT.wind * PPM * (E.engine === 'ballista' ? 0.35 : 1);
  const T = Math.max(0.6, 2 * v * Math.sin(ang) / G) * (full ? 0.7 : 0.35) + 0.2, h = 1 / 60;
  const pts = [[x, y]];
  for (let t = 0; t < T; t += h) {
    if (drag) { const rvx = vx - wx, sp = Math.hypot(rvx, vy); vx -= drag * sp * rvx * h; vy -= drag * sp * vy * h; }
    vy += G * h; x += vx * h; y += vy * h;
    pts.push([x, y]);
    if (y > groundAt(x)) break;
  }
  BT.predKey = key; BT.pred = pts;
  return pts;
}

// ---------------------------------------------------------------- 전투 프레임 갱신
function updateBattle(dt) {
  BT.time += dt;
  BT.acc += dt;
  let steps = 0;
  while (BT.acc >= DT && steps < 5) {
    stepWorld(DT);
    processEvents();
    processBreaks();
    for (const b of world.bodies) {
      if (b.isStatic || b.removed) continue;
      if (b.y > GY + 500 || b.x < -400 || b.x > BT.W + 400) {
        if (b.kind === 'unit') killUnit(b, 'fall'); else { b.removed = true; if (b.kind === 'block') BT.destroyed.add(b.origin); }
      } else if (b.kind === 'unit' && b.alive && b.inWater) {
        b.waterT += DT; if (b.waterT > 0.8) killUnit(b, 'drown');
      } else if (b.kind === 'shard' && BT.time - b.born > b.life) b.removed = true;
      else if (b.kind === 'proj' && b.impacted && b.sleeping && BT.time - b.impactT > 12) b.removed = true;
    }
    purgeRemoved();
    BT.acc -= DT; steps++;
  }
  if (steps === 5) BT.acc = 0;
  if (BT.blocks.some(b => b.removed)) BT.blocks = BT.blocks.filter(b => !b.removed);
  BT.projs = BT.projs.filter(b => !b.removed);

  updateLaunch(dt); updateFlight(dt); updateReload(dt);
  updateFires(dt); updateGas(dt); updateParticles(dt);

  BT.loadT -= dt;
  if (BT.loadT <= 0) { BT.loadT = 0.5; computeLoads(false); crushOverloaded(); }
  BT.destrT -= dt;
  if (BT.destrT <= 0) { BT.destrT = 0.3; calcDestr(); }
  // 연쇄 붕괴 굉음
  BT.impactLog = BT.impactLog.filter(t => BT.time - t < 0.4);
  if (BT.impactLog.length > 9) { SFX.rumble(); BT.shake = Math.max(BT.shake, 7); BT.impactLog.length = 0; }
  BT.shake = Math.max(0, BT.shake - dt * 18);
  checkEnd(dt);
  BT.hudT -= dt;
  if (BT.hudT <= 0) { BT.hudT = 0.12; updateHUD(); }
}

  Y: '#f0c040', R: '#8a1f18', P: '#5a2a7a', W: '#f4f4f4' };
const SPR_DEF = {

  lord: ['Y.YY.Y', 'YYYYYY', '.FFFF.', '.EFFF.', '.FFFF.', 'RRPPRR', 'RPPPPR', 'RPYYPR', 'RPPPPR', 'RPPPPR', '.L..L.', '.S..S.'],
};

// ---- 색 유틸 ----
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (k < 0) { r *= 1 + k; g *= 1 + k; b *= 1 + k; } else { r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
const MATC = {};
for (const [k, m] of Object.entries(MATS)) MATC[k] = { base: m.color, hi: shade(m.color, 0.25), lo: shade(m.color, -0.3), char: shade(m.color, -0.62), dark: m.dark };

// ---- 하늘 · 원경 ----
const CLOUDS = Array.from({ length: 7 }, (_, i) => ({ x: Math.random(), y: 0.05 + Math.random() * 0.3, s: 0.6 + Math.random() * 0.9 }));
function drawSky(region, dt, windPx) {

  g.addColorStop(0, R.sky[0]); g.addColorStop(1, R.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);

  const sg = ctx.createRadialGradient(sx, sy, 4, sx, sy, 90);
  sg.addColorStop(0, region === 2 ? 'rgba(255,220,150,.95)' : 'rgba(255,250,220,.95)'); sg.addColorStop(0.25, 'rgba(255,240,200,.5)'); sg.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = sg; ctx.fillRect(sx - 90, sy - 90, 180, 180);

  for (const c of CLOUDS) {
    c.x += (windPx * 0.00004 + 0.004) * dt * (0.5 + c.s * 0.5);
    if (c.x > 1.2) c.x = -0.2; if (c.x < -0.2) c.x = 1.2;
    const x = c.x * CW, y = c.y * CH, s = c.s * 40;

}
function hillY(seed, x, amp, base) {

// ---- 카메라 ----
function updateCamera(dt) {
  const hudH = $('hud').classList.contains('hidden') ? 0 : $('hud').offsetHeight;
  const panH = $('panel').classList.contains('hidden') ? 0 : $('panel').offsetHeight;
  const top = hudH, bot = CH - panH, ph = Math.max(140, bot - top);
  let s = Math.min(CW / BT.W, ph / 640);
  s = Math.max(s, 0.25);
  const viewW = CW / s, pan = viewW < BT.W - 1;
  const offX = pan ? 0 : (CW - BT.W * s) / 2;
  const cam = BT.cam;
  if (pan) {
    const maxX = BT.W - viewW;
    let target;
    if (cam.follow != null) target = cam.follow - viewW * 0.45;
    else if (cam.hold > 0) { cam.hold -= dt; target = cam.x; }
    else target = cam.home;
    target = clamp(target, 0, maxX);
    if (cam.drag) cam.x = clamp(cam.x, 0, maxX);
    else cam.x += (target - cam.x) * Math.min(1, dt * (cam.follow != null ? 6 : 3));
  } else cam.x = 0;
  VIEW = { s, offX, gsy: bot - Math.max(26, 50 * s), camX: cam.x, viewW, top, bot, pan };
}
const toScreen = (x, y) => [(x - VIEW.camX) * VIEW.s + VIEW.offX, (y - GY) * VIEW.s + VIEW.gsy];

function drawWater(dt) {

function drawBlock(b) {

  } else {
    ctx.fillStyle = b.charred ? m.char : m.base; ctx.fillRect(-hw, -hh, w, h);

        ctx.beginPath();

        ctx.beginPath();
        for (let x = -hw; x < hw; x += 4) { ctx.moveTo(x, -hh); ctx.lineTo(x + 3, hh); }
        ctx.stroke();

      }
      case 'stone': case 'granite': {

        ctx.fillStyle = m.lo; ctx.fillRect(-hw, hh - 2.5, w, 2.5); ctx.fillRect(hw - 2.5, -hh, 2.5, h);
        if (b.mat === 'granite') { ctx.fillStyle = 'rgba(220,220,230,.25)'; for (let i = 0; i < 5; i++) ctx.fillRect((r() - 0.5) * (w - 6), (r() - 0.5) * (h - 6), 1.6, 1.6); }
        else { ctx.fillStyle = 'rgba(60,60,60,.18)'; for (let i = 0; i < 3; i++) ctx.fillRect((r() - 0.5) * (w - 8), (r() - 0.5) * (h - 8), 3, 2); }

        if (b.corroded) { ctx.fillStyle = 'rgba(150,100,40,.45)'; ctx.fillRect(-hw, -hh, w, h); }

  }
  ctx.restore();
}

  const a = AMMO_BY[b.ammo] || AMMO[0], r = b.r;
  if (b.ammo === 'fire') {
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, r * 1.8); g.addColorStop(0, 'rgba(255,240,150,1)'); g.addColorStop(0.5, 'rgba(255,120,20,.9)'); g.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 1.8, 0, 6.283); ctx.fill();
  }
  ctx.fillStyle = a.color; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1; ctx.stroke();
  if (b.ammo === 'boulder') { ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(-r * 0.4, -r * 0.2, r * 0.5, r * 0.3); ctx.fillRect(r * 0.1, r * 0.3, r * 0.3, r * 0.2); }
  if (b.ammo === 'ap') { ctx.fillStyle = '#9aa0a8'; ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, 6.283); ctx.fill(); }
  if (b.ammo === 'shrapnel') { ctx.strokeStyle = '#d8b060'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.4, -r - 5); ctx.stroke(); if (Math.random() < 0.5) addPart({ type: 'spark', x: b.x, y: b.y - r, vx: rand(-30, 30), vy: rand(-40, 0), life: 0.2, max: 0.2, size: 2 }); }
  if (b.ammo === 'gas') { ctx.fillStyle = '#5a7a2a'; ctx.fillRect(-r * 0.4, -r - 3, r * 0.8, 4); }
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.35, r * 0.35, 0, 6.283); ctx.fill();
  ctx.restore();
}

// ---- 파티클 ----
function drawParts() {
  for (const p of BT.parts) {
    const f = clamp(p.life / p.max, 0, 1);
    switch (p.type) {
      case 'chunk':
        ctx.save(); ctx.globalAlpha = Math.min(1, f * 2); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
        ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.8); ctx.restore(); break;
      case 'dust': case 'smoke':
        ctx.globalAlpha = f * (p.type === 'smoke' ? 0.35 : 0.45);
        ctx.fillStyle = p.type === 'smoke' ? '#5a5550' : (p.color || '#c8c2b6');
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.6 - f * 0.6), 0, 6.283); ctx.fill(); break;
      case 'gas':
        ctx.globalAlpha = f * 0.22; ctx.fillStyle = '#8fd04a';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.3 - f * 0.3), 0, 6.283); ctx.fill(); break;
      case 'splash':
        ctx.globalAlpha = f; ctx.fillStyle = '#bfe0ff'; ctx.fillRect(p.x - 1, p.y - 1, p.size, p.size); break;
      case 'ring':
        ctx.globalAlpha = f * 0.8; ctx.strokeStyle = '#fff3d0'; ctx.lineWidth = 3 * f + 0.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - f * 0.85), 0, 6.283); ctx.stroke(); break;
      case 'whiteflag':
        ctx.globalAlpha = Math.min(1, f * 2); ctx.fillStyle = '#3b2716'; ctx.fillRect(p.x - 0.8, p.y - 26, 1.6, 26);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(p.x + 0.8, p.y - 26, 12, 8); break;
      default: break;
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  for (const p of BT.parts) {
    const f = clamp(p.life / p.max, 0, 1);
    if (p.type === 'flame') {
      ctx.fillStyle = f > 0.6 ? `rgba(255,230,120,${f * 0.9})` : f > 0.3 ? `rgba(255,140,30,${f * 0.9})` : `rgba(200,50,10,${f})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + f * 0.6), 0, 6.283); ctx.fill();
    } else if (p.type === 'spark') {
      ctx.fillStyle = `rgba(255,220,120,${f})`; ctx.fillRect(p.x, p.y, 2, 2);
    } else if (p.type === 'flash') {
      const g = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, p.size);
      g.addColorStop(0, `rgba(255,250,220,${f})`); g.addColorStop(1, 'rgba(255,180,80,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.283); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ---- 궤적 ----
function drawPath(pts, dash, color, width) {
  if (!pts || pts.length < 2) return;
  ctx.setLineDash(dash); ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke(); ctx.setLineDash([]);
}

// ---- 메인 렌더 ----
function stressColor(v) {
  const t = clamp(v, 0, 1.2) / 1.2;
  const r = t < 0.5 ? Math.round(80 + t * 2 * 175) : 255, g = t < 0.5 ? 220 : Math.round(220 - (t - 0.5) * 2 * 200);
  return `rgba(${r},${g},40,.55)`;
}
function renderBattle(dt) {
  updateCamera(dt);
  const { s, offX, gsy, camX } = VIEW;
  drawSky(BT.S.region, dt, BT.wind * PPM);
  drawHills(BT.S.region, camX, gsy, s);
  const sh = BT.shake, shx = sh ? rand(-sh, sh) : 0, shy = sh ? rand(-sh, sh) : 0;
  ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * (offX - camX * s + shx), DPR * (gsy - GY * s + shy));
  for (const b of world.bodies) if (b.isStatic) drawStatic(b);
  for (const g of BT.gfires) { ctx.fillStyle = 'rgba(40,20,10,.5)'; ctx.fillRect(g.x - 26, g.y - 3, 52, 4); }
  drawEngine();
  drawPath(BT.prevTrail, [5, 6], 'rgba(255,255,255,.55)', 2);
  const pred = predictPath();
  drawPath(pred, [2, 5], 'rgba(255,215,90,.95)', 2.2);
  for (const b of BT.blocks) if (!b.removed) drawBlock(b);
  if (BT.stressOn) for (const b of BT.blocks) {
    if (b.removed) continue;
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = stressColor(b.stress); ctx.fillRect(-b.hw, -b.hh, b.hw * 2, b.hh * 2); ctx.restore();
  }
  if (has('t_scout') && BT.state === 'aim' && !BT.result) {
    const pulse = 0.5 + 0.5 * Math.sin(BT.time * 6);
    ctx.strokeStyle = `rgba(255,60,40,${0.5 + pulse * 0.5})`; ctx.lineWidth = 2.5;
    for (const b of BT.weak) { if (b.removed) continue; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.strokeRect(-b.hw - 2, -b.hh - 2, b.hw * 2 + 4, b.hh * 2 + 4); ctx.restore(); }
  }
  for (const u of BT.units) if (u.alive) drawUnit(u);
  for (const b of BT.projs) if (!b.removed) drawProj(b);
  drawPath(BT.trail, [], 'rgba(255,250,230,.8)', 2.2);
  drawWater(dt);
  drawParts();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // 화면 공간 오버레이
  ctx.textAlign = 'center';
  if (has('t_scout') && !BT.result) {
    for (const u of BT.units) if (u.alive && u.role === 'lord') {
      const [x, y] = toScreen(u.x, u.y - u.hh - 10);
      const bob = Math.sin(BT.time * 4) * 3;
      ctx.fillStyle = '#ffd34a'; ctx.beginPath(); ctx.moveTo(x, y + bob); ctx.lineTo(x - 7, y - 10 + bob); ctx.lineTo(x + 7, y - 10 + bob); ctx.fill();
      ctx.font = 'bold 11px sans-serif'; ctx.fillText('영주', x, y - 14 + bob);
    }
    if (BT.state === 'aim') for (const b of BT.weak) {
      if (b.removed) continue;
      const [x, y] = toScreen(b.x, b.y);
      ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = '#ffdddd'; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 3;
      ctx.strokeText('취약', x, y + 3); ctx.fillText('취약', x, y + 3);
    }
  }
  for (const f of BT.floats) {
    const [x, y] = toScreen(f.x, f.y);
    ctx.globalAlpha = clamp(f.life / f.max * 1.8, 0, 1);
    ctx.font = `bold ${Math.round(15 * f.scale)}px "Malgun Gothic", sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.strokeText(f.text, x, y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, x, y);
  }
  ctx.globalAlpha = 1;
  // 화면 위로 벗어난 탄환 고도 표시
  for (const b of BT.main) {
    if (b.removed || b.impacted) continue;
    const [x, y] = toScreen(b.x, b.y);
    if (y < VIEW.top + 4 && x > 0 && x < CW) {
      ctx.fillStyle = '#ffe9a0'; ctx.beginPath(); ctx.moveTo(x, VIEW.top + 6); ctx.lineTo(x - 7, VIEW.top + 18); ctx.lineTo(x + 7, VIEW.top + 18); ctx.fill();
      ctx.font = 'bold 11px sans-serif'; ctx.fillText(`${Math.round((GY - b.y) / PPM)}m`, x, VIEW.top + 31);
      break;
    }
  }
  if (BT.stressOn) {
    const x = 12, y = VIEW.top + 12;
    ctx.fillStyle = 'rgba(20,13,7,.85)'; ctx.fillRect(x, y, 196, 46);
    const g = ctx.createLinearGradient(x + 10, 0, x + 186, 0);
    g.addColorStop(0, 'rgb(80,220,40)'); g.addColorStop(0.5, 'rgb(255,220,40)'); g.addColorStop(1, 'rgb(255,20,40)');
    ctx.fillStyle = g; ctx.fillRect(x + 10, y + 24, 176, 10);
    ctx.fillStyle = '#f1e2bf'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('하중 분석: 지지 하중 / 허용 하중', x + 10, y + 16);
    ctx.textAlign = 'center';
  }
}
function renderMenuBackdrop(dt) {
  drawSky(0, dt, 30);
  const gsy = CH * 0.78;
  drawHills(0, performance.now() * 0.01, gsy, 1);
  ctx.fillStyle = '#3d2c1b'; ctx.fillRect(0, gsy, CW, CH - gsy);
  ctx.fillStyle = '#5f9a3a'; ctx.fillRect(0, gsy, CW, 8);

  for (let i = 0; i < 3; i++) { ctx.fillRect(bx - 50 + i * 24, by - 214, 12, 14); ctx.fillRect(bx + 200 + i * 26, by - 244, 14, 14); }

}
